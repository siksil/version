name: Deploy version files to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - '*.json'
      - '*.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate JSON
        run: |
          for f in *.json; do jq empty "$f"; done

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d6b9cb9bd0a55ef1caa0eb7a22c5d0b8 # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45d48ae2d8b0e1a0b6d3e5b0c9f2d1 # v3.0.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
